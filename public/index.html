<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BLOCKFALL · 낙하 블록 퍼즐</title>
  <meta name="description" content="설치 없이 브라우저에서 바로 즐기는 낙하 블록 퍼즐 게임">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/game.js" defer></script>
</head>
<body>
  <main class="app">
    <h1 class="logo">BLOCK<span>FALL</span></h1>

    <section class="game">
      <aside class="panel">
        <div class="box">
          <h2>HOLD</h2>
          <canvas id="hold" width="96" height="96"></canvas>
        </div>
        <dl class="box stats">
          <dt>SCORE</dt><dd id="score">0</dd>
          <dt>BEST</dt><dd id="best">0</dd>
          <dt>LEVEL</dt><dd id="level">1</dd>
          <dt>LINES</dt><dd id="lines">0</dd>
        </dl>
      </aside>

      <div class="board-wrap">
        <canvas id="board" width="300" height="600" aria-label="게임 보드"></canvas>
        <div id="overlay" class="overlay">
          <p id="overlay-msg" class="overlay-msg">BLOCKFALL</p>
          <button id="start-btn" type="button">시작하기</button>
          <p class="hint">Enter 키로도 시작할 수 있어요</p>
        </div>
      </div>

      <aside class="panel">
        <div class="box">
          <h2>NEXT</h2>
          <canvas id="next" width="96" height="240"></canvas>
        </div>
        <ul class="box keys">
          <li><kbd>← →</kbd> 이동</li>
          <li><kbd>↓</kbd> 소프트 드롭</li>
          <li><kbd>↑</kbd>/<kbd>X</kbd> 회전</li>
          <li><kbd>Z</kbd> 역회전</li>
          <li><kbd>Space</kbd> 하드 드롭</li>
          <li><kbd>C</kbd> 홀드</li>
          <li><kbd>P</kbd> 일시정지</li>
        </ul>
      </aside>
    </section>

    <nav class="touch" aria-label="터치 조작">
      <button type="button" data-action="hold">홀드</button>
      <button type="button" data-action="rotateCCW">↺</button>
      <button type="button" data-action="rotateCW">↻</button>
      <button type="button" data-action="pause">Ⅱ</button>
      <button type="button" data-action="left" data-repeat>←</button>
      <button type="button" data-action="down" data-repeat>↓</button>
      <button type="button" data-action="right" data-repeat>→</button>
      <button type="button" data-action="drop">⤓</button>
    </nav>
  </main>
</body>
</html>
